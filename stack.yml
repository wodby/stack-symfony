name: symfony
icon: symfony
docs: https://wodby.com/docs/2.0/stacks/catalog/symfony/
title: Symfony

services:
- name: php
  title: PHP
  service: symfony-php
  required: true
  links:
  - name: db
    service: postgres
  - name: sendmail
    service: mailpit
  - name: otel
    service: otel-collector

- name: nginx
  title: Nginx
  service: php-nginx
  required: true
  links:
  - name: backend
    service: php

# Doctrine and the post-deployment migrations need the database.
- name: postgres
  title: PostgreSQL
  service: postgres
  required: true
  volumes:
  - name: data
    size: 20

- name: mailpit
  title: Mailpit
  service: mailpit

- name: opensmtpd
  disabled: true
  title: OpenSMTPD
  service: opensmtpd

- name: cloud-postgres
  title: Cloud PostgreSQL
  service: cloud-postgres
  disabled: true

- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  disabled: true
  # The application sends telemetry to the Collector inside the environment only.
  endpoints:
  - name: otlp
    ports:
    - name: otlp-http
      private: true
  workloads:
  - name: main
    containers:
    - name: otelcol
      resources:
        request:
          cpu: 100
          memory: 128
        limit:
          cpu: 500
          memory: 512
